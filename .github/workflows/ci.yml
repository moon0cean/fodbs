name: CI

# Pull requests into main run this before they can merge.
# A merge is a push to main, so the same checks run again on the protected branch.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fodbs
          POSTGRES_PASSWORD: fodbs
          POSTGRES_DB: fodbs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fodbs -d fodbs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://fodbs:fodbs@localhost:5432/fodbs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
