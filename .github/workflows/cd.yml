name: CD

# Only a merge into main (a push to the protected branch) builds the image.
# This does not deploy. The host stays a manual step.
on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  image:
    name: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: fodbs:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
